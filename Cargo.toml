[package]
name = "cargo-schemata"
version = "0.4.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Mutation testing for Rust that builds mutants once, as schemata."
repository = "https://github.com/t09tanaka/cargo-schemata"
homepage = "https://github.com/t09tanaka/cargo-schemata"
documentation = "https://github.com/t09tanaka/cargo-schemata#readme"
readme = "README.md"
keywords = ["mutation-testing", "testing", "cargo-subcommand", "mutants", "schemata"]
categories = ["development-tools::testing", "development-tools::cargo-plugins"]
exclude = [".github", "scripts"]

[[bin]]
name = "cargo-schemata"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.86"
camino = "1.1.9"
cargo_metadata = "0.23"
clap = { version = "4.5", features = ["derive"] }
flickzeug = "0.4.5"
globset = "0.4.16"
itertools = "0.13"
libc = "0.2"
proc-macro2 = { version = "1.0.91", features = ["span-locations"] }
quote = "1.0.35"
regex = "1.10"
serde = { version = "1.0.209", features = ["derive"] }
serde_json = "1.0.128"
signal-hook = "0.3"
similar = "2.1"
syn = { version = "2.0.104", features = ["full", "extra-traits", "visit"] }
toml = "1.1.2"
